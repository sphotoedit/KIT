<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sphotoedit KIT</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:   #2F38B2;
    --white:  #FFFFFF;
    --dark:   #323232;
    --yellow: #F5DF4E;
    --black:  #0D0D0D;
    --bg:     #F5F6FA;
    --card:   #FFFFFF;
    --muted:  #888;
    --border: #E8E8F0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    justify-content: center;
  }

  .wrap {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  /* ── HERO COVER ─────────────────────────────────── */
  .hero-cover {
    position: relative;
    background: var(--blue);
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 36px 22px 36px 22px;
    gap: 20px;
    text-decoration: none;
    cursor: pointer;
    transition: filter 0.2s;
  }

  .hero-cover::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 160px; height: 160px;
    background: rgba(245, 223, 78, 0.12);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero-cover::after {
    content: '';
    position: absolute;
    bottom: -30px; left: -20px;
    width: 120px; height: 120px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero-cover:hover { filter: brightness(1.07); }
  .hero-cover:active { filter: brightness(0.95); }

  .hero-avatar {
    width: 110px;
    height: 110px;
    border-radius: 18px;
    object-fit: cover;
    object-position: top center;
    flex-shrink: 0;
    border: 3px solid var(--yellow);
    position: relative;
    z-index: 1;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }

  .hero-text {
    flex: 1;
    position: relative;
    z-index: 1;
  }

  .hero-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--yellow);
    text-transform: uppercase;
    margin-bottom: 7px;
    display: block;
  }

  .hero-headline {
    font-size: 26px;
    font-weight: 800;
    color: var(--white);
    line-height: 1.15;
    margin-bottom: 16px;
  }

  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--yellow);
    color: var(--black);
    font-size: 13px;
    font-weight: 700;
    padding: 9px 18px;
    border-radius: 40px;
    letter-spacing: 0.01em;
    transition: transform 0.15s;
  }

  .hero-cta:active { transform: scale(0.96); }

  .hero-cta-icon {
    width: 16px; height: 16px;
    flex-shrink: 0;
  }

  .hero-cover .accent-bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--yellow);
    border-radius: 0 4px 4px 0;
  }

  /* ── COLLAB STRIP ────────────────────────────────── */
  .collab-strip {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--yellow);
    padding: 13px 18px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    text-decoration: none;
    color: var(--black);
    font-size: 12.5px;
    font-weight: 600;
    transition: filter 0.2s;
  }

  .collab-strip:hover { filter: brightness(0.96); }

  .collab-strip svg:first-child {
    color: var(--black);
    flex-shrink: 0;
  }

  .collab-strip span {
    flex: 1;
    line-height: 1.3;
  }

  .collab-strip strong {
    color: var(--black);
    font-weight: 800;
  }

  .collab-arrow {
    color: rgba(0,0,0,0.3);
    flex-shrink: 0;
    transition: color 0.15s, transform 0.15s;
  }

  .collab-strip:hover .collab-arrow {
    color: var(--black);
    transform: translateX(3px);
  }

  /* ── SEARCH ZONE ─────────────────────────────────── */
  .search-zone {
    background: var(--white);
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .brand-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--blue);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .brand-label::before {
    content: '';
    display: inline-block;
    width: 18px; height: 3px;
    background: var(--yellow);
    border-radius: 2px;
  }

  .search-wrap {
    position: relative;
  }

  .search-input {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 40px 12px 42px;
    font-family: 'Poppins', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--dark);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(47,56,178,0.1);
    background: var(--white);
  }

  .search-input::placeholder { color: #aaa; font-weight: 400; }
  .search-input::-webkit-search-cancel-button { display: none; }

  .search-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--blue);
    pointer-events: none;
    display: flex;
    opacity: 0.7;
  }

  .clear-btn {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    background: var(--border);
    border: none;
    border-radius: 50%;
    width: 22px; height: 22px;
    color: #888;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    transition: background 0.15s;
  }
  .clear-btn:hover { background: #ddd; }
  .clear-btn.visible { display: flex; }

  /* ── CARDS AREA ──────────────────────────────────── */
  .cards-area {
    flex: 1;
    padding: 12px 14px 24px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    padding: 4px 2px 10px;
  }

  .count-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .entry-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: 14px;
    margin-bottom: 8px;
    padding: 14px 16px;
    text-decoration: none;
    cursor: pointer;
    border: 1.5px solid var(--border);
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
    animation: fadeUp 0.24s ease both;
    position: relative;
    overflow: hidden;
  }

  .entry-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: transparent;
    border-radius: 0 3px 3px 0;
    transition: background 0.15s;
  }

  .entry-card:hover {
    border-color: var(--blue);
    box-shadow: 0 4px 20px rgba(47,56,178,0.1);
    transform: translateY(-1px);
  }

  .entry-card:hover::before {
    background: var(--blue);
  }

  .entry-card:active { transform: scale(0.99); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .entry-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 8px;
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 58px;
    text-align: center;
    color: #fff;
    letter-spacing: 0.03em;
  }

  .entry-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--dark);
    line-height: 1.35;
    flex: 1;
    text-align: left;
  }

  .entry-arrow {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    color: var(--border);
    transition: color 0.2s, transform 0.2s;
  }

  .entry-card:hover .entry-arrow {
    color: var(--blue);
    transform: translateX(3px);
  }

  mark {
    background: var(--yellow);
    color: var(--black);
    border-radius: 3px;
    padding: 0 2px;
  }

  /* ── FOOTER ──────────────────────────────────────── */
  .credits-footer {
    text-align: center;
    padding: 14px 24px 28px;
    font-size: 10px;
    font-weight: 600;
    color: #bbb;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── STATE BOXES ─────────────────────────────────── */
  .state-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    text-align: center;
    gap: 12px;
  }
  .state-icon { font-size: 36px; opacity: 0.5; }
  .state-label {
    font-size: 13px;
    color: #999;
    line-height: 1.6;
  }
  .retry-btn {
    margin-top: 4px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 30px;
    padding: 10px 28px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .retry-btn:hover { background: #1e2590; }

  /* ── SKELETON ────────────────────────────────────── */
  .skeleton-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: 14px;
    margin-bottom: 8px;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    overflow: hidden;
  }

  .skel {
    background: linear-gradient(
      90deg,
      #f0f0f5 25%, #e4e4ee 50%, #f0f0f5 75%
    );
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .skel-badge { width: 58px; height: 28px; border-radius: 8px; }
  .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .skel-line { height: 12px; border-radius: 6px; }
  .skel-arrow { width: 16px; height: 16px; border-radius: 50%; }

  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ── LOCK OVERLAY ────────────────────────────────── */
  .lock-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,20,0.85);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .lock-overlay.active { display: flex; }

  .lock-card {
    background: var(--white);
    width: 100%;
    max-width: 320px;
    border-radius: 24px;
    padding: 28px 22px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    animation: modalPop 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.88); }
    to   { opacity: 1; transform: scale(1); }
  }

  .lock-icon-wrap {
    width: 56px; height: 56px;
    background: rgba(47,56,178,0.08);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    color: var(--blue);
  }

  .lock-card h3 {
    font-size: 18px;
    font-weight: 800;
    color: var(--dark);
    margin-bottom: 6px;
  }

  .lock-card p {
    font-size: 12px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 18px;
    font-weight: 500;
  }

  .lock-btn-join {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--blue);
    color: var(--white);
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    padding: 12px;
    border-radius: 40px;
    box-shadow: 0 4px 16px rgba(47,56,178,0.3);
    margin-bottom: 10px;
    transition: background 0.2s;
  }
  .lock-btn-join:hover { background: #1e2590; }

  .lock-btn-direct {
    width: 100%;
    background: var(--dark);
    color: white;
    border: none;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 12px;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .lock-btn-direct:hover { background: var(--black); transform: scale(0.98); }
  .lock-btn-direct:disabled { background: #ccc; cursor: not-allowed; transform: none; }

  /* ── TOAST ───────────────────────────────────────── */
  .instant-toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--dark);
    color: white;
    padding: 8px 20px;
    border-radius: 60px;
    font-size: 12px;
    font-weight: 600;
    z-index: 2200;
    pointer-events: none;
    animation: fadeUp 0.2s ease-out;
    white-space: nowrap;
    font-family: 'Poppins', sans-serif;
    border-left: 3px solid var(--yellow);
  }
</style>
</head>
<body>

      Join Telegram Channel

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbz7XuDQPEw5c__5noSJPCcON0fqAwyO03nJKzCxoPaVXGhSJKwIaUts2eO_NuIB1c9sWw/exec';

  const BADGE_COLORS = ['#2F38B2'];

  let allEntries = [];
  let query = '';
  let pendingTargetUrl = '';

  const searchInput    = document.getElementById('searchInput');
  const clearBtn       = document.getElementById('clearBtn');
  const entriesList    = document.getElementById('entriesList');
  const countBar       = document.getElementById('countBar');
  const lockOverlay    = document.getElementById('lockOverlay');
  const modalDirectBtn = document.getElementById('modalDirectBtn');

  function showToast(msg, duration = 1800) {
    let existing = document.querySelector('.instant-toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'instant-toast';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => { if (toast && toast.remove) toast.remove(); }, duration);
  }

  function checkUrlParameters() {
    const urlParams = new URLSearchParams(window.location.search);
    const codeParam = urlParams.get('code');
    if (codeParam) {
      query = codeParam.trim();
      searchInput.value = query;
      clearBtn.classList.add('visible');
    }
  }

  searchInput.addEventListener('input', () => {
    query = searchInput.value.trim();
    clearBtn.classList.toggle('visible', query.length > 0);
    renderEntries();
  });

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    query = '';
    clearBtn.classList.remove('visible');
    renderEntries();
    searchInput.focus();
  });

  function handleCardClick(event, url) {
    event.preventDefault();
    if (url === '#') return;
    if (sessionStorage.getItem('tg_joined') === 'true') {
      window.open(url, '_blank', 'noopener,noreferrer');
      return;
    }
    pendingTargetUrl = url;
    lockOverlay.classList.add('active');
  }

  async function onDirectUnlock() {
    if (modalDirectBtn.disabled) return;
    modalDirectBtn.disabled = true;
    modalDirectBtn.innerHTML = "⏳ Unlocking...";
    sessionStorage.setItem('tg_joined', 'true');
    await new Promise(r => setTimeout(r, 120));
    lockOverlay.classList.remove('active');
    if (pendingTargetUrl && pendingTargetUrl !== '#') {
      window.open(pendingTargetUrl, '_blank', 'noopener,noreferrer');
      showToast(`✅ Opened → ${pendingTargetUrl.substring(0, 50)}`, 2000);
      pendingTargetUrl = '';
    } else {
      showToast(`✓ Unlocked! Click any tool to open.`, 1500);
    }
    modalDirectBtn.disabled = false;
    modalDirectBtn.innerHTML = "🔓 Direct Link";
  }

  modalDirectBtn.addEventListener('click', onDirectUnlock);

  lockOverlay.addEventListener('click', (e) => {
    if (e.target === lockOverlay) {
      lockOverlay.classList.remove('active');
      pendingTargetUrl = '';
    }
  });

  async function fetchData() {
    renderState('loading');
    try {
      const res  = await fetch(API_URL + '?_ts=' + Date.now(), { redirect: 'follow' });
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch(e) { renderState('error', 'Bad response: ' + text.slice(0, 160)); return; }
      if (json.error) { renderState('error', json.error); return; }
      allEntries = (json.entries || []).reverse();
      if (allEntries.length === 0) { renderState('empty'); return; }
      checkUrlParameters();
      renderEntries();
      setTimeout(() => { searchInput.focus(); }, 300);
    } catch(err) {
      renderState('error', err.message);
    }
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function hi(text, q) {
    if (!q || !text) return esc(text);
    const e  = esc(text);
    const qe = esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return e.replace(new RegExp('('+qe+')','gi'),'<mark>$1</mark>');
  }

  function renderEntries() {
    const q = query.toLowerCase();
    const filtered = q
      ? allEntries.filter(e =>
          (e.title||'').toLowerCase().includes(q) ||
          (e.code||'').toLowerCase().includes(q) ||
          (e.link||'').toLowerCase().includes(q)
        )
      : allEntries;

    countBar.textContent = filtered.length
      ? filtered.length + ' item' + (filtered.length === 1 ? '' : 's')
      : '';

    if (filtered.length === 0) {
      entriesList.innerHTML = `<div class="state-box">
        <div class="state-icon">🔍</div>
        <div class="state-label">No results for <strong>"${esc(query)}"</strong></div>
      </div>`;
      return;
    }

    entriesList.innerHTML = filtered.map((e, i) => {
      const color = BADGE_COLORS[i % BADGE_COLORS.length];
      const targetUrl = esc(e.link || '#');
      return `
        <a class="entry-card"
           href="${targetUrl}"
           onclick="handleCardClick(event, '${targetUrl}')"
           style="animation-delay:${Math.min(i * 0.04, 0.4)}s">
          <span class="entry-code" style="background:${color}">${hi(e.code || '—', q)}</span>
          <span class="entry-title">${hi(e.title || 'Untitled', q)}</span>
          <span class="entry-arrow">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </span>
        </a>`;
    }).join('');
  }

  function renderState(type, msg) {
    countBar.textContent = '';
    if (type === 'loading') {
      const widths = [
        ['55%','80%'], ['70%','45%'], ['60%','90%'],
        ['80%','55%'], ['50%','75%'], ['65%','60%']
      ];
      entriesList.innerHTML = widths.map(([w1, w2], i) => `
        <div class="skeleton-card" style="animation-delay:${i * 0.06}s">
          <div class="skel skel-badge"></div>
          <div class="skel-lines">
            <div class="skel skel-line" style="width:${w1}"></div>
            <div class="skel skel-line" style="width:${w2}; opacity:0.6"></div>
          </div>
          <div class="skel skel-arrow"></div>
        </div>`).join('');
    } else if (type === 'error') {
      entriesList.innerHTML = `<div class="state-box">
        <div class="state-icon">⚠️</div>
        <div class="state-label">${esc(msg || 'Something went wrong')}</div>
        <button class="retry-btn" onclick="fetchData()">Retry</button>
      </div>`;
    } else if (type === 'empty') {
      entriesList.innerHTML = `<div class="state-box">
        <div class="state-icon">📭</div>
        <div class="state-label">No entries found in sheet.</div>
      </div>`;
    }
  }

  window.handleCardClick = handleCardClick;
  window.fetchData = fetchData;

  fetchData();
</script>
</body>
</html>
