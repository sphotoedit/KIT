<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sphotoedit KIT · Direct Unlock</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: #1a0533;
  }

  .wrap {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: linear-gradient(
      160deg,
      #6c3fc5 0%,
      #c0478a 35%,
      #e8613a 60%,
      #e8a030 80%,
      #c06bc0 100%
    );
  }

  .hero {
    padding: 32px 14px 16px;
    color: #fff;
    text-align: center;
  }

  .hero-title {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.5px;
    margin-bottom: 2px;
  }

  .hero-sub {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    margin-bottom: 20px;
    letter-spacing: 0.02em;
  }

  .tg-banner-container {
    margin-bottom: 22px;
    animation: slideDownFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .tg-banner-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.96);
    border: 2px solid rgba(41, 168, 232, 0.85);
    padding: 12px 16px;
    border-radius: 16px;
    text-decoration: none;
    color: #111;
    box-shadow: 0 0 0 0 rgba(41, 168, 232, 0.5);
    animation: glow-pulse 2.5s infinite ease-in-out;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .tg-banner-link:hover, .tg-banner-link:active {
    transform: scale(1.02);
    box-shadow: 0 8px 24px rgba(41,168,232,0.4);
  }

  .tg-banner-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .tg-banner-icon {
    width: 38px;
    height: 38px;
    background: #2ea6da;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
  }

  .tg-banner-text h4 {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.2px;
    color: #128ec9;
  }

  .tg-banner-text p {
    font-size: 11px;
    color: #555;
    font-weight: 600;
  }

  .tg-banner-badge {
    background: #2ea6da;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 20px;
    letter-spacing: 0.04em;
  }

  @keyframes slideDownFade {
    from { opacity: 0; transform: translateY(-15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes glow-pulse {
    0% { box-shadow: 0 0 0 0 rgba(41, 168, 232, 0.6); }
    50% { box-shadow: 0 0 0 12px rgba(41, 168, 232, 0); }
    100% { box-shadow: 0 0 0 0 rgba(41, 168, 232, 0); }
  }

  .search-wrap {
    position: relative;
    width: 100%;
    margin: 0 auto;
  }

  .search-input {
    width: 100%;
    background: rgba(255,255,255,0.97);
    border: none;
    border-radius: 18px;
    padding: 14px 44px 14px 46px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #222;
    outline: none;
    box-shadow: 0 6px 24px rgba(0,0,0,0.15);
    transition: box-shadow 0.25s;
  }
  .search-input:focus {
    box-shadow: 0 8px 32px rgba(0,0,0,0.22), 0 0 0 2.5px rgba(255,255,255,0.6);
  }
  .search-input::placeholder { color: #aaa; font-weight: 400; }
  .search-input::-webkit-search-cancel-button { display: none; }

  .search-icon {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    color: #a060c0;
    pointer-events: none;
    display: flex;
  }

  .clear-btn {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    background: #e0d0f0;
    border: none;
    border-radius: 50%;
    width: 22px; height: 22px;
    color: #888;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  .clear-btn.visible { display: flex; }

  .cards-area {
    flex: 1;
    padding: 6px 14px 20px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 4px 8px;
  }
  .count-label {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.03em;
  }

  .entry-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.95);
    border-radius: 18px;
    margin-bottom: 10px;
    padding: 16px 18px;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    transition: transform 0.13s, box-shadow 0.13s;
    animation: fadeUp 0.28s ease both;
    position: relative;
    overflow: hidden;
  }

  .entry-card:hover, .entry-card:active {
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 8px 28px rgba(0,0,0,0.18);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .entry-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 62px;
    text-align: center;
    color: #fff;
    letter-spacing: 0.03em;
  }

  .entry-title {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1.35;
    flex: 1;
    text-align: left;
  }

  .entry-arrow {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    color: #bbb;
    transition: color 0.2s, transform 0.2s;
  }
  .entry-card:hover .entry-arrow,
  .entry-card:active .entry-arrow {
    color: #a060c0;
    transform: translateX(3px);
  }

  mark {
    background: rgba(180, 80, 200, 0.15);
    color: #8030b0;
    border-radius: 3px;
    padding: 0 2px;
  }

  .credits-footer {
    text-align: center;
    padding: 16px 24px 32px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.04em;
  }

  .state-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    text-align: center;
    gap: 12px;
  }
  .state-icon { font-size: 40px; opacity: 0.6; }
  .state-label {
    font-size: 14px;
    color: rgba(255,255,255,0.75);
    line-height: 1.6;
  }
  .retry-btn {
    margin-top: 4px;
    background: rgba(255,255,255,0.9);
    color: #7030a0;
    border: none;
    border-radius: 30px;
    padding: 10px 28px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .skeleton-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.18);
    border-radius: 18px;
    margin-bottom: 10px;
    padding: 16px 18px;
    overflow: hidden;
  }

  .skel {
    background: linear-gradient(
      90deg,
      rgba(255,255,255,0.12) 25%,
      rgba(255,255,255,0.28) 50%,
      rgba(255,255,255,0.12) 75%
    );
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .skel-badge { width: 62px; height: 32px; border-radius: 10px; }
  .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .skel-line { height: 13px; border-radius: 6px; }
  .skel-arrow { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }

  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* LOCK MODAL — sleek, "Direct Link" replaces old button */
  .lock-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 5, 30, 0.96);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .lock-overlay.active { display: flex; }

  .lock-card {
    background: #fff;
    width: 100%;
    max-width: 340px;
    border-radius: 32px;
    padding: 28px 22px;
    text-align: center;
    box-shadow: 0 30px 50px rgba(0,0,0,0.5);
    animation: modalPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.88); }
    to   { opacity: 1; transform: scale(1); }
  }

  .lock-icon-wrap {
    width: 60px;
    height: 60px;
    background: #eef8fe;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    color: #29a8e8;
  }

  .lock-card h3 {
    font-size: 20px;
    font-weight: 800;
    color: #111;
    margin-bottom: 6px;
  }

  .lock-card p {
    font-size: 12.5px;
    color: #555;
    line-height: 1.4;
    margin-bottom: 18px;
    font-weight: 500;
  }

  .lock-btn-join {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #2ea6da;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 12px;
    border-radius: 40px;
    box-shadow: 0 4px 12px rgba(41,168,232,0.3);
    margin-bottom: 12px;
    transition: background 0.2s;
  }
  .lock-btn-join:hover { background: #128ec9; }

  /* DIRECT LINK BUTTON — primary action to unlock + open instantly */
  .lock-btn-direct {
    width: 100%;
    background: #1a1a2e;
    color: white;
    border: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 12px;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .lock-btn-direct:hover {
    background: #2a2a44;
    transform: scale(0.98);
  }
  .lock-btn-direct:active {
    transform: scale(0.97);
  }
  .lock-btn-direct:disabled {
    background: #aaa;
    cursor: not-allowed;
    transform: none;
  }

  .instant-toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e2a32e6;
    backdrop-filter: blur(12px);
    color: white;
    padding: 8px 20px;
    border-radius: 60px;
    font-size: 13px;
    font-weight: 600;
    z-index: 2200;
    pointer-events: none;
    animation: fadeUp 0.2s ease-out;
    white-space: nowrap;
    font-family: monospace;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="hero-title">Sphotoedit KIT</div>
    <div class="hero-sub">Find Tools. Get Instant Links.</div>
    
    <div class="tg-banner-container">
      <a class="tg-banner-link" href="https://t.me/+qkeG942fmqhkMmM1" target="_blank" rel="noopener noreferrer">
        <div class="tg-banner-left">
          <div class="tg-banner-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.47-.52-.17L7.64 13.5 3.53 12.2c-.9-.28-.92-.9.19-1.33L19.8 4.58c.74-.28 1.38.16 1.14 1.18l-2.74 12.91c-.2 1-.8 1.25-1.63.78l-4.17-3.07-2.01 1.94c-.22.22-.41.41-.85.41z"/>
            </svg>
          </div>
          <div class="tg-banner-text">
            <h4>Join Telegram for Free Design Assets</h4>
            <p>Unlock links instantly & premium resources</p>
          </div>
        </div>
        <div class="tg-banner-badge">JOIN</div>
      </a>
    </div>

    <div class="search-wrap">
      <span class="search-icon">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
      </span>
      <input class="search-input" id="searchInput" type="search"
        placeholder="Search by title, code…"
        autocomplete="off" spellcheck="false">
      <button class="clear-btn" id="clearBtn">✕</button>
    </div>
  </div>

  <div class="cards-area">
    <div class="meta-row">
      <span class="count-label" id="countBar"></span>
    </div>
    <div id="entriesList"></div>
  </div>

  <div class="credits-footer">
    Powered by Sphotoedit.
  </div>
</div>

<!-- LOCK MODAL: "I have joined" replaced with "Direct Link" button -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-icon-wrap">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.47-.52-.17L7.64 13.5 3.53 12.2c-.9-.28-.92-.9.19-1.33L19.8 4.58c.74-.28 1.38.16 1.14 1.18l-2.74 12.91c-.2 1-.8 1.25-1.63.78l-4.17-3.07-2.01 1.94c-.22.22-.41.41-.85.41z"/>
      </svg>
    </div>
    <h3>Link Locked</h3>
    <p>Join Telegram → tap <strong>Direct Link</strong> to unlock instantly.</p>
    
    <a class="lock-btn-join" id="modalJoinBtn" href="https://t.me/+qkeG942fmqhkMmM1" target="_blank" rel="noopener noreferrer">
      Join Channel
    </a>
    <button class="lock-btn-direct" id="modalDirectBtn">
      🔓 Direct Link
    </button>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbz7XuDQPEw5c__5noSJPCcON0fqAwyO03nJKzCxoPaVXGhSJKwIaUts2eO_NuIB1c9sWw/exec';
  const BADGE_COLORS = [
    '#7c4dca', '#c0478a', '#e0572a', '#2196a8',
    '#4caf7d', '#e08020', '#5c6bc0', '#c0522a'
  ];

  let allEntries = [];
  let query = '';
  let pendingTargetUrl = '';

  const searchInput    = document.getElementById('searchInput');
  const clearBtn       = document.getElementById('clearBtn');
  const entriesList    = document.getElementById('entriesList');
  const countBar       = document.getElementById('countBar');
  const lockOverlay    = document.getElementById('lockOverlay');
  const modalJoinBtn   = document.getElementById('modalJoinBtn');
  const modalDirectBtn = document.getElementById('modalDirectBtn');

  function showToast(msg, duration = 1800) {
    let existing = document.querySelector('.instant-toast');
    if(existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'instant-toast';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => { if(toast && toast.remove) toast.remove(); }, duration);
  }

  function checkUrlParameters() {
    const urlParams = new URLSearchParams(window.location.search);
    const codeParam = urlParams.get('code');
    if (codeParam) {
      query = codeParam.trim();
      searchInput.value = query;
      clearBtn.classList.add('visible');
    }
  }

  searchInput.addEventListener('input', () => {
    query = searchInput.value.trim();
    clearBtn.classList.toggle('visible', query.length > 0);
    renderEntries();
  });

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    query = '';
    clearBtn.classList.remove('visible');
    renderEntries();
    searchInput.focus();
  });

  // Core handler: if already unlocked, open directly
  function handleCardClick(event, url) {
    event.preventDefault();
    if (url === '#') return;
    
    // already joined/unlocked via session
    if (sessionStorage.getItem('tg_joined') === 'true') {
      window.open(url, '_blank', 'noopener,noreferrer');
      return;
    }

    pendingTargetUrl = url;
    lockOverlay.classList.add('active');
  }

  // DIRECT LINK BUTTON: marks joined, immediately opens the pending link.
  // This replaces old "I have joined" behaviour but now button says Direct Link
  async function onDirectUnlock() {
    if (modalDirectBtn.disabled) return;
    modalDirectBtn.disabled = true;
    modalDirectBtn.innerHTML = "⏳ Unlocking...";
    
    // Simulate quick check / mark as joined (session flag)
    sessionStorage.setItem('tg_joined', 'true');
    
    // short micro delay for feedback (smooth)
    await new Promise(r => setTimeout(r, 120));
    
    // close modal
    lockOverlay.classList.remove('active');
    
    // if we have pending URL -> open it directly
    if (pendingTargetUrl && pendingTargetUrl !== '#') {
      window.open(pendingTargetUrl, '_blank', 'noopener,noreferrer');
      showToast(`✅ Direct Link opened → ${pendingTargetUrl.substring(0, 50)}`, 2000);
      pendingTargetUrl = '';
    } else {
      showToast(`✓ Unlocked! Click any tool to open directly.`, 1500);
    }
    
    // reset button state
    modalDirectBtn.disabled = false;
    modalDirectBtn.innerHTML = "🔓 Direct Link";
  }

  modalDirectBtn.addEventListener('click', onDirectUnlock);

  // If user clicks "Join Channel" they open Telegram, we keep modal open.
  // When they return they can click "Direct Link" and instantly open the resource.
  // Optional: add event to remove overlay on background click? but fine.
  lockOverlay.addEventListener('click', (e) => {
    if(e.target === lockOverlay) {
      // optional: clicking backdrop closes without unlocking? we'll close to not trap user.
      lockOverlay.classList.remove('active');
      pendingTargetUrl = '';
    }
  });

  async function fetchData() {
    renderState('loading');
    try {
      const res  = await fetch(API_URL + '?_ts=' + Date.now(), { redirect: 'follow' });
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch(e) { renderState('error', 'Bad response: ' + text.slice(0,160)); return; }
      if (json.error) { renderState('error', json.error); return; }

      allEntries = (json.entries || []).reverse();
      if (allEntries.length === 0) { renderState('empty'); return; }
      
      checkUrlParameters();
      renderEntries();

      setTimeout(() => {
        searchInput.focus();
      }, 300);

    } catch(err) {
      renderState('error', err.message);
    }
  }

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function hi(text, q) {
    if (!q || !text) return esc(text);
    const e  = esc(text);
    const qe = esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return e.replace(new RegExp('('+qe+')','gi'),'<mark>$1</mark>');
  }

  function renderEntries() {
    const q = query.toLowerCase();
    const filtered = q
      ? allEntries.filter(e =>
          (e.title||'').toLowerCase().includes(q) ||
          (e.code||'').toLowerCase().includes(q) ||
          (e.link||'').toLowerCase().includes(q)
        )
      : allEntries;

    countBar.textContent = filtered.length
      ? filtered.length + ' item' + (filtered.length === 1 ? '' : 's')
      : '';

    if (filtered.length === 0) {
      entriesList.innerHTML = `<div class="state-box">
        <div class="state-icon">🔍</div>
        <div class="state-label">No results for <strong>"${esc(query)}"</strong></div>
      </div>`;
      return;
    }

    entriesList.innerHTML = filtered.map((e, i) => {
      const color = BADGE_COLORS[i % BADGE_COLORS.length];
      const targetUrl = esc(e.link || '#');
      return `
        <a class="entry-card"
           href="${targetUrl}"
           onclick="handleCardClick(event, '${targetUrl}')"
           style="animation-delay:${Math.min(i * 0.04, 0.4)}s">
          <span class="entry-code" style="background:${color}">${hi(e.code || '—', q)}</span>
          <span class="entry-title">${hi(e.title || 'Untitled', q)}</span>
          <span class="entry-arrow">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </span>
        </a>`;
    }).join('');
  }

  function renderState(type, msg) {
    countBar.textContent = '';
    if (type === 'loading') {
      const widths = [
        ['55%','80%'], ['70%','45%'], ['60%','90%'],
        ['80%','55%'], ['50%','75%'], ['65%','60%']
      ];
      entriesList.innerHTML = widths.map(([w1, w2], i) => `
        <div class="skeleton-card" style="animation-delay:${i * 0.06}s">
          <div class="skel skel-badge"></div>
          <div class="skel-lines">
            <div class="skel skel-line" style="width:${w1}"></div>
            <div class="skel skel-line" style="width:${w2}; opacity:0.6"></div>
          </div>
          <div class="skel skel-arrow"></div>
        </div>`).join('');
    } else if (type === 'error') {
      entriesList.innerHTML = `<div class="state-box">
        <div class="state-icon">⚠️</div>
        <div class="state-label">${esc(msg||'Something went wrong')}</div>
        <button class="retry-btn" onclick="fetchData()">Retry</button>
      </div>`;
    } else if (type === 'empty') {
      entriesList.innerHTML = `<div class="state-box">
        <div class="state-icon">📭</div>
        <div class="state-label">No entries found in sheet.</div>
      </div>`;
    }
  }

  window.handleCardClick = handleCardClick;
  window.fetchData = fetchData;
  
  fetchData();
</script>
</body>
</html>
